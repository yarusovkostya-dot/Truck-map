<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Карта TIR парковок и фирм</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background: #121212; }
        #map { width: 100%; height: 100vh; }
        
        .filter-bar {
            position: absolute;
            top: 12px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .filter-btn {
            background: #2a2a2a;
            border: 2px solid #3b82f6;
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn.active {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        }
        .filter-btn.danger-btn {
            border-color: #ef4444;
            color: #ef4444;
        }
        .filter-btn.danger-btn.active {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }

        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 50%;
            border: 3px solid #3b82f6;
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
            font-size: 18px;
            transition: transform 0.2s;
        }
        .custom-marker.matched {
            border-color: #22c55e;
            background: #dcfce7;
            transform: scale(1.3);
            z-index: 1000 !important;
        }
        .custom-marker.warning {
            border-color: #ef4444;
            background: #fee2e2;
            transform: scale(1.3);
            z-index: 1000 !important;
        }

        #loading {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="filter-bar">
        <button class="filter-btn danger-btn" onclick="toggleFilter('no_parking', this)">⛔ Выгоняют / Нельзя паузу</button>
        <button class="filter-btn" onclick="toggleFilter('firm_parking', this)">🅿️ Парковка у фирмы</button>
        <button class="filter-btn" onclick="toggleFilter('street_parking', this)">🛣️ Вдоль дороги</button>
        <button class="filter-btn" onclick="toggleFilter('shower', this)">🚿 Душ</button>
        <button class="filter-btn" onclick="toggleFilter('security', this)">🛡️ Охрана</button>
        <button class="filter-btn" onclick="toggleFilter('quiet', this)">🤫 Тихо</button>
        <button class="filter-btn" onclick="toggleFilter('shop', this)">🛒 Магазин</button>
    </div>

    <div id="loading">🔍 Поиск мест вокруг вас...</div>
    <div id="map"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        var map = L.map('map').setView([52.2297, 21.0122], 10);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let locations = [];
        let markers = [];
        let activeFilters = new Set();

        const keywords = {
            no_parking: ["нельзя стоять", "выгоняют", "паузу нельзя", "запрещено", "прогоняют", "zakaz postoju", "wyganiają", "no parking", "parkverbot"],
            firm_parking: ["парковка у фирмы", "перед фирмой", "на территории", "przed firmą", "na terenie", "company parking", "vor der firma"],
            street_parking: ["вдоль дороги", "на улице", "промзона", "обочина", "na ulicy", "na drodze", "industrial area", "straßenrand"],
            shower: ["душ", "душевая", "prysznic", "shower", "dusche"],
            security: ["охрана", "забор", "камеры", "ochrona", "strzeżony", "security", "bewacht"],
            quiet: ["тихо", "тишина", "spokojnie", "quiet", "ruhig"],
            shop: ["магазин", "супермаркет", "sklep", "shop", "lidl", "aldi", "biedronka"]
        };

        // Загрузка реальных мест вокруг с помощью Overpass API
        function loadRealPlaces(lat, lng) {
            document.getElementById('loading').style.display = 'block';

            // Радиус поиска около 15 км
            const query = `
                [out:json];
                (
                  node["amenity"="parking"](around:15000, ${lat}, ${lng});
                  node["highway"="rest_area"](around:15000, ${lat}, ${lng});
                  node["amenity"="fuel"](around:15000, ${lat}, ${lng});
                  node["industrial"](around:15000, ${lat}, ${lng});
                );
                out body 50;
            `;

            fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query))
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    locations = data.elements.map(el => {
                        let type = 'parking';
                        if (el.tags.amenity === 'fuel') type = 'fuel';
                        if (el.tags.industrial) type = 'factory';

                        return {
                            name: el.tags.name || (type === 'fuel' ? '⛽ АЗС' : (type === 'factory' ? '🏢 Промзона / Фирма' : '🅿️ Парковка TIR')),
                            type: type,
                            coords: [el.lat, el.lon],
                            reviews: [
                                el.tags.description || "Загрузка реальных отзывов...",
                                el.tags.note || ""
                            ]
                        };
                    });
                    renderMarkers();
                })
                .catch(err => {
                    document.getElementById('loading').style.display = 'none';
                    console.log('Ошибка загрузки данных', err);
                });
        }

        function renderMarkers() {
            markers.forEach(m => map.removeLayer(m.marker));
            markers = [];

            locations.forEach(loc => {
                let isMatch = false;
                let isWarning = false;

                if (activeFilters.size > 0) {
                    activeFilters.forEach(filter => {
                        const words = keywords[filter] || [];
                        const hasWord = loc.reviews.some(rev => 
                            words.some(w => rev.toLowerCase().includes(w))
                        );
                        if (hasWord) {
                            if (filter === 'no_parking') isWarning = true;
                            else isMatch = true;
                        }
                    });
                }

                let iconSymbol = '🅿️';
                if (loc.type === 'fuel') iconSymbol = '⛽';
                if (loc.type === 'factory') iconSymbol = '🏢';

                let markerClass = 'custom-marker';
                if (isWarning) {
                    markerClass = 'custom-marker warning';
                    iconSymbol = '⚠️';
                } else if (isMatch) {
                    markerClass = 'custom-marker matched';
                }

                const customIcon = L.divIcon({
                    className: markerClass,
                    html: iconSymbol,
                    iconSize: [38, 38],
                    iconAnchor: [19, 19]
                });

                const m = L.marker(loc.coords, {icon: customIcon}).addTo(map);
                m.bindPopup(`<b>${loc.name}</b><br><a href="https://www.google.com/maps/search/?api=1&query=${loc.coords[0]},${loc.coords[1]}" target="_blank" style="color:#3b82f6;font-weight:bold;">📍 Открыть маршрут</a>`);
                markers.push({ location: loc, marker: m });
            });
        }

        function toggleFilter(type, btn) {
            btn.classList.toggle('active');
            if (activeFilters.has(type)) {
                activeFilters.delete(type);
            } else {
                activeFilters.add(type);
            }
            renderMarkers();
        }

        // Определение местоположения пользователя
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                map.setView([lat, lng], 11);
                
                L.circleMarker([lat, lng], {
                    radius: 9,
                    color: '#ffffff',
                    weight: 3,
                    fillColor: '#3b82f6',
                    fillOpacity: 1
                }).addTo(map).bindPopup("<b>Вы здесь</b>");

                loadRealPlaces(lat, lng);
            }, function() {
                // Если нет геолокации, загружаем по умолчанию для центра Варшавы
                loadRealPlaces(52.2297, 21.0122);
            });
        } else {
            loadRealPlaces(52.2297, 21.0122);
        }
    </script>
</body>
</html>
